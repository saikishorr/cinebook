name: CineBook checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moviebooking
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/moviebooking
      CHAT_PROVIDER: fake
      CHAT_MODEL_ID: fake-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r backend/requirements-dev.txt -r worker/requirements.txt
      - name: Install schema and sample shows
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/add_upcoming_shows.sql
      - name: Load cinema snapshot and generate demo programmes offline
        run: |
          python - <<'PY'
          import os, sys, psycopg
          sys.path.insert(0, 'scripts')
          from import_cinemas import import_curated, load_curated
          with psycopg.connect(os.environ['DATABASE_URL'], autocommit=True) as connection:
              import_curated(connection, load_curated())
          PY
      - run: python -m ruff check --config backend/pyproject.toml backend worker
      - run: python -m pytest backend
      - run: python -m pytest worker
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
